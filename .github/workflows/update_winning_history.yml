name: Update Winning History

on:
  repository_dispatch:
    types: [cf-cron-trigger]
  workflow_dispatch: # 수동 실행

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install @octokit/rest json-stringify-pretty-compact

      - name: Fetch & Update
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node scripts/update_winning_history.mjs
