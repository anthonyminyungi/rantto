name: Run Tests

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '*.config.ts'
      - 'tsconfig*.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Tests
        run: echo "No source files were changed. Skipping tests to save time!"
